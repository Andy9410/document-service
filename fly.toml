app = "document-service-academy"

[build]

[env]
  PORT = "8080"
  SEARCH_TOP_K = "3"

[[services]]
  internal_port = 8080
  protocol = "tcp"

[[services.ports]]
  handlers = ["http"]
  port = 80
  force_https = true

[[services.ports]]
  handlers = ["tls", "http"]
  port = 443

[services.concurrency]
  type = "requests"
  hard_limit = 50
  soft_limit = 30

# 🔵 TCP check más tolerante
[[services.tcp_checks]]
  grace_period = "30s"
  interval = "20s"
  timeout = "10s"
  restart_limit = 0

# 🔵 HTTP health check más relajado
[[services.http_checks]]
  interval = "30s"
  grace_period = "30s"
  method = "GET"
  path = "/health"
  protocol = "http"
  timeout = "10s"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1